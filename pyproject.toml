[project]
name = "ultimate-tic-tac-toe"
version = "0.1.0"
description = ""
authors = [
    {name = "DolevPeretz",email = "dolevop@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.6,<0.116.0)",
    "pydantic (>=2.10.5,<3.0.0)",
    "uvicorn (>=0.34.0,<0.35.0)"
]

[tool.poetry]
packages = [{include = "ultimate_tic_tac_toe", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pyright = "^1.1.391"
ruff = "^0.9.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
".bzr",
".direnv",
".eggs",
".git",
".git-rewrite",
".hg",
".ipynb_checkpoints",
".mypy_cache",
".nox",
".pants.d",
".pyenv",
".pytest_cache",
".pytype",
".ruff_cache",
".svn",
".tox",
".venv",
".vscode",
"__pypackages__",
"_build",
"buck-out",
"build",
"dist",
"node_modules",
"site-packages",
]

# Same as Black.
line-length = 150

[tool.ruff.lint]
select = [
"E", # pycodestyle errors
"W", # pycodestyle warnings
"F", # pyflakes
"I", # isort
"B", # flake8-bugbear
"C4", # flake8-comprehensions
"UP", # pyupgrade
]
ignore = [
"E501", # line too long, handled by black
"W191", # indentation contains tabs
"E266", # Too many leading '#' for block comment
"E712", # use if cond: or if not cond: to check for truth values.
"PT011", # pytest.raises({exception}) is too broad, set the match parameter or use a more specific exception
]

extend-select = [
# builtins plugin: https://github.com/gforcada/flake8-builtins
"A0",
# pep8-naming plugin: https://github.com/PyCQA/pep8-naming
"N8",
# pytest-style plugin: https://github.com/m-burst/flake8-pytest-style
"PT",
# simplify plugin: https://github.com/MartinThoma/flake8-simplify
"SIM",
# bugbear plugin opinionated warnings: https://github.com/PyCQA/flake8-bugbear
"B9",
# Local custom plugins are configured below, please see documentation here: https://flake8.pycqa.org/en/latest/user/configuration.html
]

extend-ignore = [
# flake8 simplify recommendation to not count iterations of a loop and use enumerate instead can lead to unreadble code, a counter isn't an index
"SIM113",
]

exclude = [
# No need to traverse our git directory
".git",
# No need to scan Github files
".github",
# There's no value in checking cache directories
"__pycache__",
# No need to scan virtual environment files
".venv",
]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "starlette"]
combine-as-imports = false
lines-between-types = 1

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

########################################################################
[tool.pyright] # pyright is the Python static analyzer that executes in VSCode by the Pylance extension bundled to VSCode's Python extension
include = ["src", "tests"]
pythonVersion = "3.12"

typeCheckingMode = "strict" # Benefit of additional type checks to surface for VSCode users




